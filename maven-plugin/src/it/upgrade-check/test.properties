# Passed to the forked build as real -D properties. invoker.goals cannot carry this: it is
# a List parameter, so Maven splits its value on commas and the CSV would become goals.
# The empty middle entry is deliberate -- plexus turns it into a null element, and a -D list
# assembled by a CI script picks up doubled commas.
uika.excludeFiles=cli-exclude.toml,,second-exclude.toml
