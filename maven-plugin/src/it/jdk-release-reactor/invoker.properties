# -U: the shared it-repo caches resolution failures across invoker runs. No <jdkRelease>
# anywhere, and -Duika.jdkRelease only on the last run: the others are about the derivation.
invoker.goals.1=uika:upgrade-check -U -Duika.cliVersion=9.9.9 -Duika.before=before.json -Duika.after=after.json
# No -N: the mojo is an aggregator, so it runs once, but the reactor has to be LOADED
# for session.getAllProjects() to see the modules that declare the releases.
# The dump records each module's own release from the same derivation.
invoker.goals.2=uika:dump-classpath
# The override replaces every module's own release, since it states the whole build's runtime.
invoker.goals.3=uika:dump-classpath -Duika.jdkRelease=21 -Duika.output=target/uika/overridden.json
