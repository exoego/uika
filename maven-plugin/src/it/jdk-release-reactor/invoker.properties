# -U: the shared it-repo caches resolution failures across invoker runs. No -Duika.jdkRelease
# and no <jdkRelease> anywhere: this IT is about the derivation, not the override.
invoker.goals=uika:upgrade-check -U -Duika.cliVersion=9.9.9 -Duika.before=before.json -Duika.after=after.json
# No -N: the mojo is an aggregator, so it runs once, but the reactor has to be LOADED
# for session.getAllProjects() to see the modules that declare the releases.
