invoker.goals.1=verify uika:dump-classpath
# -pl resolves dependencies for the SELECTED projects only, so the dump must carry the
# selected module alone. Emitting the whole reactor put the unselected app module in with
# zero artifacts, a silent under-report. With verify, so that surefire's TEST resolution
# runs on lib first: the goal must still see the RUNTIME resolution it declares, not
# whatever the lifecycle resolved before it.
invoker.goals.2=-pl lib verify uika:dump-classpath -Duika.output=target/uika/selected.json
# An output under a regular file cannot be written. That has to fail the build with the
# goal's own message naming the path, not with a bare stack trace from the write.
invoker.goals.3=uika:dump-classpath -Duika.output=pom.xml/classpath.json
invoker.buildResult.3=failure
