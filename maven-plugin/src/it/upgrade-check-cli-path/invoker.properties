# The stub binary is a shell script. A pre-build hook returning false is a FAILURE, not
# a skip, so the platform gate is declarative.
invoker.os.family=!windows
# Per-project environment, supported since maven-invoker-plugin 3.2.2 (this build pins
# 3.10.1). The mojo-level <environmentVariables> would apply to every IT and steer the
# ones that exist to exercise the resolver.
#
# The value must be ABSOLUTE: the mojo hands it to ProcessBuilder, which resolves a bare
# name against PATH rather than the working directory. ${basedir} is no help, since in
# invoker.properties it interpolates to the INVOKING project rather than to this clone;
# ${uikaItCloneDir} is the same POM property the plugin's <cloneProjectsTo> uses, so the
# two cannot drift. A wrong path fails loudly ("UIKA_CLI_PATH does not name a file")
# rather than quietly passing.
invoker.environmentVariables.UIKA_CLI_PATH=${uikaItCloneDir}/upgrade-check-cli-path/uika-stub
# No -Duika.cliVersion, on purpose: the override has to win before the version is even
# wanted. With it ignored the goal would ask the resolver for uika-cli:${plugin.version},
# which no repository here serves.
invoker.goals=uika:upgrade-check -Duika.before=before.json -Duika.after=after.json
