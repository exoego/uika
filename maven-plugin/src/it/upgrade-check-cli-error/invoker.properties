# A CLI that could not run must also fail the build, so the same buildResult applies as in
# upgrade-check-violations. What differs is the failure TYPE, which verify.groovy pins.
invoker.buildResult=failure
# -U: the shared it-repo caches resolution failures across invoker runs.
invoker.goals.1=uika:upgrade-check -U -Duika.cliVersion=9.9.9 -Duika.before=before.json -Duika.after=after.json
# No repository serves this version, so the resolver fails before any process starts.
# Offline, so the answer depends neither on the network nor on what an earlier run cached;
# invocation 1 already fetched everything else the goal needs.
invoker.goals.2=uika:upgrade-check -o -Duika.cliVersion=9.9.9-missing -Duika.before=before.json -Duika.after=after.json
# The evidence directory holds a symlink loop, so its walk fails before the CLI starts.
invoker.goals.3=uika:upgrade-check -Duika.cliVersion=9.9.9 -Duika.before=before.json -Duika.after=after.json -Duika.jfr=looped-logs
