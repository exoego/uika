coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # Informational while the numbers settle. Flip to a target once they are known.
        informational: true

# Flags stay, but only as the upload identity. Carryforward is a property of an upload,
# so it has no component equivalent: all four uploads come from one job, and a step
# failing halfway would report the later ones as a drop to zero rather than as missing.
flag_management:
  default_rules:
    carryforward: true

# The per-front-end split. Driven by paths rather than flag_regexes, so it can say what
# the flags cannot: jvm-plugin-core is compiled into both the Gradle and the Maven
# plugin, so its coverage arrives under two flags, and only a path rule scores it as one
# unit.
#
# The last four front ends are instrumented by nothing. ci.yml's coverage job uploads
# for the first five only, and the rest are exercised by forked builds (sbt scripted,
# shell ITs, bazel) that produce no report. They are listed anyway because a component
# needs no upload behind it, and an unmeasured one renders as the empty set rather than
# as 0% -- the comment row states "not measured" instead of implying a failure. Listing
# them now also fixes the component_id, so the coverage series is continuous from
# whenever each one does get instrumented.
#
# No component declares statuses, so none of them opens a check. That matches the flags
# they replace, which had no per-flag status either.
component_management:
  individual_components:
    - component_id: cli
      name: CLI
      paths:
        - cli/**
    - component_id: jvm_plugin_core
      name: jvm-plugin-core
      paths:
        - jvm-plugin-core/**
    - component_id: gradle_plugin
      name: Gradle plugin
      paths:
        - gradle-plugin/**
    - component_id: maven_plugin
      name: Maven plugin
      paths:
        - maven-plugin/**
    - component_id: clojure_tool
      name: Clojure tool
      paths:
        - clojure-tool/**
    - component_id: sbt_plugin
      name: sbt plugin
      paths:
        - sbt-plugin/**
    - component_id: mill_plugin
      name: Mill plugin
      paths:
        - mill-plugin/**
    - component_id: lein_plugin
      name: Leiningen plugin
      paths:
        - lein-plugin/**
    - component_id: bazel_rules
      name: Bazel rules
      paths:
        - bazel-rules/**

comment:
  layout: "condensed_header, components, files"
  # Codecov's default. require_changes would drop the comment on any PR that moves no
  # measured line, which is every build-config PR, and on the first one of all, since
  # main has no base report to diff against yet.
  require_changes: false

ignore:
  # Committed symlinks into jvm-plugin-core. The Gradle and Maven reports name those
  # sources by package path alone, so every symlink is a second candidate that would
  # split one file's coverage, and now also charge it to the wrong component.
  - "bazel-rules/java/net/exoego/uika/plugin/core"
  - "lein-plugin/java-src/net/exoego/uika/plugin/core"
