coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # Informational while the numbers settle. Flip to a target once they are known.
        informational: true

# Each build tool uploads from its own CI job, eight uploads per commit that finish in no
# fixed order. wait_for_ci holds the status and the comment until every CI check on the
# commit is done, so neither goes out on a partial set. It is the default, and is written
# out because the parallel jobs now depend on it.
codecov:
  notify:
    wait_for_ci: true

# Flags stay, but only as the upload identity. Carryforward is a property of an upload,
# so it has no component equivalent. A tool job that fails before its upload would
# otherwise read as that flag dropping to zero rather than as missing.
flag_management:
  default_rules:
    carryforward: true
  # The Rust CLI's flag. CI stopped sending it in #278-#281, but carryforward copies the
  # parent commit's session of every flag the YAML allows, so it lived on in every report.
  # Two things do not end that. `ignore` runs only while an upload is processed, never on
  # a copied session, which is why the `cli/**` entry #346 added left the crate's 11106
  # lines in main. Deleting the flag in the Codecov UI is a soft delete the worker never
  # reads. Only a rule here ends it.
  individual_flags:
    - name: rust
      carryforward: false

# The per-front-end split. Driven by paths rather than flag_regexes, so it can say what
# the flags cannot: jvm-plugin-core is compiled into both the Gradle and the Maven
# plugin, so its coverage arrives under two flags, and only a path rule scores it as one
# unit.
#
# Every component is measured, but two of the numbers are over less than the whole
# component and cannot be read as "the rest is untested":
#
#   Leiningen plugin  its unit suite alone. it/run.sh forks `lein uika`, and cloverage
#                     sees only namespaces loaded in the JVM it reports from.
#   Mill plugin       JaCoCo over Scala 3, which reached 74 of the entry point's 125 executable
#                     lines. The rest are in synthetic methods JaCoCo skips, and scoverage
#                     reaches fewer still (Mill's task bodies are inline macros, which
#                     Scala 3 does not instrument).
#
# Bazel rules used to be a third: `bazel coverage` reaches //java:manifest_test alone, so
# DumpMain, MergeMain and Materialize read 0 while the integration test was exercising
# nearly all of them. Its ITs now carry a JaCoCo agent of their own and run the unit suite
# under it too, so one report covers both halves; the Makefile's bazel-coverage target
# says how, and why it is one report rather than an lcov beside an XML.
#
# No component declares statuses, so none of them opens a check. That matches the flags
# they replace, which had no per-flag status either.
component_management:
  individual_components:
    - component_id: cli_java
      name: CLI
      paths:
        - cli-java/**
    - component_id: jvm_plugin_core
      name: jvm-plugin-core
      paths:
        - jvm-plugin-core/**
    - component_id: gradle_plugin
      name: Gradle plugin
      paths:
        - gradle-plugin/**
    - component_id: maven_plugin
      name: Maven plugin
      paths:
        - maven-plugin/**
    - component_id: clojure_tool
      name: Clojure tool
      paths:
        - clojure-tool/**
    - component_id: lein_plugin
      name: Leiningen plugin
      paths:
        - lein-plugin/**
    - component_id: sbt_plugin
      name: sbt plugin
      paths:
        - sbt-plugin/**
    - component_id: mill_plugin
      name: Mill plugin
      paths:
        - mill-plugin/**
    - component_id: bazel_rules
      name: Bazel rules
      paths:
        - bazel-rules/**

comment:
  layout: "condensed_header, components, files"
  # Codecov's default. require_changes would drop the comment on any PR that moves no
  # measured line, which is every build-config PR, and on the first one of all, since
  # main has no base report to diff against yet.
  require_changes: false

ignore:
  # Committed symlinks into jvm-plugin-core. The Gradle and Maven reports name those
  # sources by package path alone, so every symlink is a second candidate that would
  # split one file's coverage, and now also charge it to the wrong component.
  - "bazel-rules/java/net/exoego/uika/plugin/core"
  - "lein-plugin/java-src/net/exoego/uika/plugin/core"
