name: Publish release

# Publishing a GitHub release triggers the whole pipeline: stage every Maven
# artifact locally, then JReleaser uploads one signed deployment to Maven Central
# and attaches the CLI jar and the Bazel archive to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Resolve version from the release tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to Maven Central
    needs: version
    runs-on: ubuntu-latest
    env:
      UIKA_VERSION: ${{ needs.version.outputs.version }}
      JRELEASER_PROJECT_VERSION: ${{ needs.version.outputs.version }}
      JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag run restores the mise cache saved on main. Saving here would
      # only create a tag-scoped duplicate.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      - name: Stage Maven artifacts
        shell: bash
        run: |
          set -euo pipefail
          mise exec -- gradle -p cli-java publishAllPublicationsToStagingRepository -PuikaVersion="$UIKA_VERSION"
          mise exec -- gradle -p gradle-plugin publishAllPublicationsToStagingRepository -PuikaVersion="$UIKA_VERSION"
          (cd sbt-plugin && mise exec -- sbt -Dsbt.supershell=false -batch \
            "set ThisBuild / version := \"$UIKA_VERSION\"" publish)
          mise exec -- mvn -f maven-plugin/pom.xml -B -Prelease -Drevision="$UIKA_VERSION" \
            -DskipTests -Dinvoker.skip=true deploy
          (cd mill-plugin && UIKA_VERSION="$UIKA_VERSION" mise exec -- ./mill publishM2Local + stageChecksums)
          make clojure-stage UIKA_VERSION="$UIKA_VERSION"
          make lein-stage UIKA_VERSION="$UIKA_VERSION"
          make bazel-stage UIKA_VERSION="$UIKA_VERSION"

      - name: Deploy to Maven Central and update the GitHub release
        run: mise exec -- jreleaser release

      - name: Upload JReleaser logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jreleaser-logs
          path: out/jreleaser/trace.log
          if-no-files-found: ignore
