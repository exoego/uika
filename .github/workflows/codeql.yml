name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly, so new queries reach unchanged code.
    - cron: '27 9 * * 4'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # Superseded PR pushes are pointless to finish. Every main commit still gets analyzed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Scala (sbt-plugin/) is NOT a CodeQL-supported language and cannot be
        # added here. Its coverage is strict scalac options in sbt-plugin/build.sbt.
        # The `java-kotlin` extractor covers the Java sources only. Under
        # build-mode `none` CodeQL skips Kotlin and says so in the log. The only
        # Kotlin here is four *.gradle.kts build scripts, which are not worth the
        # autobuild of three Gradle builds plus Maven and sbt that Kotlin needs.
        language: [ actions, java-kotlin, rust ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # None of these need a build. Rust supports no other mode, and Java is
          # analyzed from source. See the matrix comment before changing this.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
