name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly, so new queries reach unchanged code.
    - cron: '27 9 * * 4'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # Superseded PR pushes are pointless to finish. Every main commit still gets analyzed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Scala (sbt-plugin/) is NOT a CodeQL-supported language and cannot be
        # added here. Its coverage is strict scalac options in sbt-plugin/build.sbt.
        # The `java-kotlin` extractor covers the Java sources only. Under
        # build-mode `none` CodeQL skips Kotlin and says so in the log. The only
        # Kotlin here is four *.gradle.kts build scripts, which are not worth the
        # autobuild of three Gradle builds plus Maven and sbt that Kotlin needs.
        language: [ actions, java-kotlin ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build-mode none still asks every Gradle and Maven build in the tree for its
      # classpath, and cold that took about 100 of the 142 seconds the analysis step ran.
      # These keys list files no CI job lists, so this job is the only one saving them.
      - name: Cache Gradle
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          set-default: false
          cache: gradle
          cache-read-only: false
          cache-dependency-path: |
            cli-java/*.gradle.kts
            gradle-plugin/*.gradle.kts
            tools/gradle-e2e/project/*.gradle.kts

      - name: Cache Maven
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          set-default: false
          cache: maven
          cache-read-only: false
          cache-dependency-path: maven-plugin/pom.xml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # Neither needs a build: Java is analyzed from source. See the matrix
          # comment before changing this.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
