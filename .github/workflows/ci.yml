name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every cache in this job restores on pull requests and saves only on
      # main. A PR-saved cache is scoped to its branch yet still evicts the
      # entries every branch shares.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The setup-java steps are a cache layer only. mise owns the build JDK,
      # and set-default keeps this one off JAVA_HOME and PATH.
      - name: Cache Gradle
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: gradle
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache sbt and coursier
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: sbt
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # The Makefile redirects every sbt directory to /tmp/uika-sbt, so
          # the default sbt paths would cache nothing. Mill shares
          # ~/.cache/coursier, hence build.mill in the hashed files.
          cache-path: |
            /tmp/uika-sbt
            ~/.cache/coursier
          cache-dependency-path: |
            sbt-plugin/build.sbt
            sbt-plugin/project/build.properties
            mill-plugin/build.mill

      - name: Cache Maven
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: maven
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # ~/.m2 also serves Leiningen and the Clojure CLI, and ~/.gitlibs
          # holds the Clojure CLI's git deps. The invoker ITs resolve into
          # target/it-repo, which ~/.m2 never covered, and refetching it cold
          # every run is what tripped a 429 once a third IT was added.
          cache-path: |
            ~/.m2/repository
            ~/.gitlibs
            maven-plugin/target/it-repo
          cache-dependency-path: |
            maven-plugin/pom.xml
            maven-plugin/src/it/**/*.xml
            clojure-tool/deps.edn
            lein-plugin/project.clj

      # Mill and Bazel have no setup-java cache id, so they keep hand-rolled
      # entries with the save steps at the end of the job.
      - name: Restore Mill cache
        id: cache-mill
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('mill-plugin/build.mill', 'mill-plugin/mill') }}
          restore-keys: |
            mill-${{ runner.os }}-

      - name: Restore Bazel cache
        id: cache-bazel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The output base is deliberately not cached. The integration test
          # cleans it on purpose (bazel-rules/it/run.sh explains why), so
          # storing it would cost gigabytes the run discards.
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_runner/cache/repos/v1
          key: bazel-${{ runner.os }}-${{ hashFiles('bazel-rules/MODULE.bazel', 'bazel-rules/it/**/MODULE.bazel.template', 'bazel-rules/it/maven-workspace/maven_install-*.json', 'bazel-rules/.bazelversion') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Check
        # UIKA_IT_ALT_JAVA gives the lein integration test a second JDK, so it can
        # prove jdkRelease follows the project's :java-cmd and not lein's own JVM.
        # mise pins temurin-21 for the build, so any OTHER release the runner ships
        # will do. Resolved rather than hardcoded, and fatal when none is found: an
        # unset variable would expand to /bin/java and the assertion would skip
        # itself, which is how a regression test quietly stops testing.
        run: |
          set -euo pipefail
          alt=""
          for home in "${JAVA_HOME_17_X64:-}" "${JAVA_HOME_11_X64:-}" "${JAVA_HOME_25_X64:-}"; do
            if [ -n "$home" ] && [ -x "$home/bin/java" ]; then alt="$home/bin/java"; break; fi
          done
          test -n "$alt" || { echo "no alternate JDK on this runner; JAVA_HOME_* are: $(env | grep -c '^JAVA_HOME_')" >&2; exit 1; }
          echo "alternate JVM for the lein probe: $alt"
          make check UIKA_IT_ALT_JAVA="$alt"

      - name: Probe fixture verdicts against a real JVM
        run: make probe

      - name: Validate binary publishing build
        run: mise exec -- gradle -p binary-publishing help -PuikaVersion=0.0.0-ci

      - name: Save Mill cache
        if: github.ref == 'refs/heads/main' && steps.cache-mill.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mill
          key: ${{ steps.cache-mill.outputs.cache-primary-key }}

      - name: Save Bazel cache
        if: github.ref == 'refs/heads/main' && steps.cache-bazel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_runner/cache/repos/v1
          key: ${{ steps.cache-bazel.outputs.cache-primary-key }}
