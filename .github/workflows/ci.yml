name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every cache in this job restores on pull requests and saves only on
      # main. A PR-saved cache is scoped to its branch yet still evicts the
      # entries every branch shares.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The setup-java steps are a cache layer only. mise owns the build JDK,
      # and set-default keeps this one off JAVA_HOME and PATH.
      - name: Cache Gradle
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: gradle
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache sbt and coursier
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: sbt
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # The Makefile redirects every sbt directory to /tmp/uika-sbt, so
          # the default sbt paths would cache nothing. Mill shares
          # ~/.cache/coursier, hence build.mill in the hashed files.
          cache-path: |
            /tmp/uika-sbt
            ~/.cache/coursier
          cache-dependency-path: |
            sbt-plugin/build.sbt
            sbt-plugin/project/build.properties
            mill-plugin/build.mill

      - name: Cache Maven
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: maven
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # ~/.m2 also serves Leiningen and the Clojure CLI, and ~/.gitlibs
          # holds the Clojure CLI's git deps. The invoker ITs resolve into
          # target/it-repo, which ~/.m2 never covered, and refetching it cold
          # every run is what tripped a 429 once a third IT was added.
          cache-path: |
            ~/.m2/repository
            ~/.gitlibs
            maven-plugin/target/it-repo
          cache-dependency-path: |
            maven-plugin/pom.xml
            maven-plugin/src/it/**/*.xml
            clojure-tool/deps.edn
            lein-plugin/project.clj

      # Mill and Bazel have no setup-java cache id, so they keep hand-rolled
      # entries with the save steps at the end of the job.
      - name: Restore Mill cache
        id: cache-mill
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('mill-plugin/build.mill', 'mill-plugin/mill') }}
          restore-keys: |
            mill-${{ runner.os }}-

      - name: Restore Bazel cache
        id: cache-bazel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The output base is deliberately not cached. The integration test
          # cleans it on purpose (bazel-rules/it/run.sh explains why), so
          # storing it would cost gigabytes the run discards.
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_runner/cache/repos/v1
          key: bazel-${{ runner.os }}-${{ hashFiles('bazel-rules/MODULE.bazel', 'bazel-rules/it/**/MODULE.bazel.template', 'bazel-rules/it/maven-workspace/maven_install-*.json', 'bazel-rules/.bazelversion') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Check
        # UIKA_IT_ALT_JAVA gives the lein integration test a second JDK, so it can
        # prove jdkRelease follows the project's :java-cmd and not lein's own JVM.
        # mise pins temurin-21 for the build, so any OTHER release the runner ships
        # will do. Resolved rather than hardcoded, and fatal when none is found: an
        # unset variable would expand to /bin/java and the assertion would skip
        # itself, which is how a regression test quietly stops testing.
        run: |
          set -euo pipefail
          alt=""
          for home in "${JAVA_HOME_17_X64:-}" "${JAVA_HOME_11_X64:-}" "${JAVA_HOME_25_X64:-}"; do
            if [ -n "$home" ] && [ -x "$home/bin/java" ]; then alt="$home/bin/java"; break; fi
          done
          test -n "$alt" || { echo "no alternate JDK on this runner; JAVA_HOME_* are: $(env | grep -c '^JAVA_HOME_')" >&2; exit 1; }
          echo "alternate JVM for the lein probe: $alt"
          make check UIKA_IT_ALT_JAVA="$alt"

      - name: Probe fixture verdicts against a real JVM
        run: make probe

      - name: Validate binary publishing build
        run: mise exec -- gradle -p binary-publishing help -PuikaVersion=0.0.0-ci

      - name: Save Mill cache
        if: github.ref == 'refs/heads/main' && steps.cache-mill.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mill
          key: ${{ steps.cache-mill.outputs.cache-primary-key }}

      - name: Save Bazel cache
        if: github.ref == 'refs/heads/main' && steps.cache-bazel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_runner/cache/repos/v1
          key: ${{ steps.cache-bazel.outputs.cache-primary-key }}

  stage:
    name: Stage release artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No ~/.m2 restore on purpose. The cold local repo IS what this job tests:
      # v0.9.0's publish died in lein-stage because leiningen's javac subprocess had to
      # fetch lein's own clojure through the emptied :repositories, and every machine
      # that has built the plugin once, the check job included, hides that. mise is
      # still restored, since the release runner restores the same tool cache.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      # The two staging steps nothing else runs. The Gradle, sbt, Maven, Mill and Clojure
      # ones go through commands their own tests already exercise, so a release-only break
      # can hide in these two alone, which is exactly what happened at v0.9.0.
      - name: Stage the Leiningen plugin
        run: make lein-stage UIKA_VERSION=0.0.0-ci

      - name: Check what lein staged
        shell: bash
        run: |
          set -euo pipefail
          dir=lein-plugin/target/staging-deploy/net/exoego/uika/lein-uika/0.0.0-ci
          for f in lein-uika-0.0.0-ci.jar lein-uika-0.0.0-ci-sources.jar \
                   lein-uika-0.0.0-ci-javadoc.jar lein-uika-0.0.0-ci.pom; do
            test -s "$dir/$f" && test -s "$dir/$f.sha1"
          done
          # PomChecker rejects a <repositories> block and jreleaser.yml's
          # applyMavenCentralRules turns that into a failed release, which is the whole
          # reason lein-stage deploys with the key emptied.
          if grep -q "<repositories>" "$dir/lein-uika-0.0.0-ci.pom"; then
            echo "the staged pom carries <repositories>, which Maven Central rejects" >&2
            exit 1
          fi

      - name: Stage the Bazel module
        shell: bash
        run: |
          set -euo pipefail
          # stage.sh hashes whatever zips dist/native holds and splices them into
          # checksums.bzl. A stand-in file exercises that splice; the real binaries come
          # from the release workflow's build jobs and nothing here reads their content.
          for classifier in linux-x86_64 macos-aarch64 macos-x86_64 windows-x86_64; do
            mkdir -p "dist/native/$classifier"
            echo "stand-in for the release binary" \
              > "dist/native/$classifier/uika-0.0.0-ci-$classifier.zip"
          done
          make bazel-stage UIKA_VERSION=0.0.0-ci

      - name: Check what stage.sh cut
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/bazel/uika-bazel-0.0.0-ci.tar.gz
          grep -q '"0.0.0-ci"' dist/bazel/bazel-rules/MODULE.bazel
          grep -q '"0.0.0-ci"' dist/bazel/bazel-rules/private/version.bzl
          # The integration test carries a local_path_override back into this repository,
          # so an archive that still had it would point consumers at a checkout they do
          # not have.
          test ! -e dist/bazel/bazel-rules/it
          python3 - <<'PY'
          import ast, pathlib, re

          src = pathlib.Path("dist/bazel/bazel-rules/private/checksums.bzl").read_text()
          spliced = re.search(r"UIKA_CLI_SHA256 = (\{.*\})", src, re.S)
          assert spliced, "stage.sh left UIKA_CLI_SHA256 unspliced"
          pins = ast.literal_eval(spliced.group(1))
          assert set(pins) == {
              "linux-x86_64",
              "macos-aarch64",
              "macos-x86_64",
              "windows-x86_64",
          }, pins
          assert all(re.fullmatch("[0-9a-f]{64}", v) for v in pins.values()), pins
          PY

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The check job owns every cache these two share a key with, so this one only
      # restores. Cargo is keyed by job name, so it gets its own entry and can save;
      # sharing with check would thrash anyway, since these builds are instrumented.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Gradle
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: gradle
          cache-read-only: true

      - name: Cache Maven
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: maven
          cache-read-only: true
          cache-path: |
            ~/.m2/repository
            ~/.gitlibs
            maven-plugin/target/it-repo
          cache-dependency-path: |
            maven-plugin/pom.xml
            maven-plugin/src/it/**/*.xml
            clojure-tool/deps.edn
            lein-plugin/project.clj

      - name: Cache sbt and coursier
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: sbt
          cache-read-only: true
          cache-path: |
            /tmp/uika-sbt
            ~/.cache/coursier
          cache-dependency-path: |
            sbt-plugin/build.sbt
            sbt-plugin/project/build.properties
            mill-plugin/build.mill

      - name: Restore Mill cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('mill-plugin/build.mill', 'mill-plugin/mill') }}
          restore-keys: |
            mill-${{ runner.os }}-

      - name: Restore Bazel cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_runner/cache/repos/v1
          key: bazel-${{ runner.os }}-${{ hashFiles('bazel-rules/MODULE.bazel', 'bazel-rules/it/**/MODULE.bazel.template', 'bazel-rules/it/maven-workspace/maven_install-*.json', 'bazel-rules/.bazelversion') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov

      # Uploaded per target rather than in one batch, so a later target failing still
      # publishes what the earlier ones measured.
      - name: Rust coverage
        run: make cargo-coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/coverage/lcov.info
          flags: rust
          disable_search: true
          fail_ci_if_error: true

      - name: Gradle plugin coverage
        run: make gradle-coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gradle-plugin/build/reports/jacoco/test/jacocoTestReport.xml
          flags: gradle
          disable_search: true
          fail_ci_if_error: true

      - name: Maven plugin coverage
        run: make maven-coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: maven-plugin/target/site/jacoco/jacoco.xml,maven-plugin/target/site/jacoco-it/jacoco.xml
          flags: maven
          disable_search: true
          fail_ci_if_error: true

      - name: Clojure tool coverage
        run: make clojure-coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: clojure-tool/target/coverage/lcov.info
          flags: clojure
          disable_search: true
          fail_ci_if_error: true

      # No cargo-build dependency, unlike clojure-coverage: the unit suite stubs the CLI
      # with a shell script, and the real-binary round trip stays in it/run.sh.
      - name: Leiningen plugin coverage
        run: make lein-coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lein-plugin/target/coverage/lcov.info
          flags: lein
          disable_search: true
          fail_ci_if_error: true

      - name: sbt plugin coverage
        run: make sbt-coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sbt-plugin/target/jacoco/jacoco.xml
          flags: sbt
          disable_search: true
          fail_ci_if_error: true

      - name: Mill plugin coverage
        run: make mill-coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: mill-plugin/out/jacoco/jacoco.xml
          flags: mill
          disable_search: true
          fail_ci_if_error: true

      - name: Bazel rules coverage
        run: make bazel-coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Two reports, because no one tool sees both halves: bazel.lcov is `bazel
          # coverage` over //java:manifest_test, bazel-it.xml is the JaCoCo agent riding
          # the integration test's `bazel run` invocations, which that number cannot see.
          files: target/coverage/bazel.lcov,target/coverage/bazel-it.xml
          flags: bazel
          disable_search: true
          fail_ci_if_error: true
