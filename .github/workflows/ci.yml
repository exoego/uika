name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR pushes are pointless to finish. Every other run gets a group of its own,
  # because a shared group cancels a PENDING run even with cancel-in-progress off, and a main
  # commit without a run has no cache save and no Codecov base.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One job per build tool, so the tools run side by side. Each job runs the instrumented
# target, which is the same suite its plain target runs with an agent attached, so every
# suite runs once. The Clojure tool and the Leiningen plugin are the exception. Cloverage
# rewrites forms rather than riding an agent, and lein-coverage leaves out it/run.sh, so
# those two jobs run both targets.
#
# Every cache restores on pull requests and saves only on main. A PR-saved cache is scoped
# to its branch yet still evicts the entries every branch shares. Each key has exactly one
# job that saves it, the job whose build fills it, so parallel jobs never race to save the
# same key. A job that needs another job's cache restores it read-only. The setup-java
# steps are a cache layer only. mise owns the build JDK, and set-default keeps theirs off
# JAVA_HOME and PATH. cache-dependency-path is what splits the keys. setup-java hashes the
# listed files into the key, so two jobs listing different files own different entries.
jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every job installs the same tools, so this job alone saves the one mise cache.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      # Also restored by the clojure, lein and bazel jobs, which build the CLI jar.
      - name: Cache Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: gradle
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-dependency-path: cli-java/*.gradle.kts

      - name: Check version placeholders
        run: make placeholder-check

      - name: Test with coverage
        run: make java-cli-coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli-java/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java-cli
          disable_search: true
          fail_ci_if_error: true

      - name: Probe fixture verdicts against a real JVM
        run: make probe

  gradle:
    name: Gradle plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      - name: Cache Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: gradle
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-dependency-path: |
            gradle-plugin/*.gradle.kts
            tools/openrewrite/rewrite.gradle

      - name: OpenRewrite dry run
        run: make rewrite-check

      - name: Check with coverage
        run: make gradle-check-coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gradle-plugin/build/reports/jacoco/test/jacocoTestReport.xml
          flags: gradle
          disable_search: true
          fail_ci_if_error: true

  maven:
    name: Maven plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      # The invoker ITs resolve into target/it-repo, which ~/.m2 never covered, and
      # refetching it cold every run is what tripped a 429 once a third IT was added.
      - name: Cache Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: maven
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-path: |
            ~/.m2/repository
            maven-plugin/target/it-repo
          cache-dependency-path: |
            maven-plugin/pom.xml
            maven-plugin/src/it/**/*.xml

      # The coverage profile keeps the invoker ITs and hands them the agent through
      # mavenOpts, so this is the whole of maven-verify.
      - name: Verify with coverage
        run: make maven-coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: maven-plugin/target/site/jacoco/jacoco.xml,maven-plugin/target/site/jacoco-it/jacoco.xml
          flags: maven
          disable_search: true
          fail_ci_if_error: true

  sbt:
    name: sbt plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      # The Makefile redirects every sbt directory to /tmp/uika-sbt, so the default sbt
      # paths would cache nothing.
      - name: Cache sbt and coursier
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: sbt
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-path: |
            /tmp/uika-sbt
            ~/.cache/coursier
          cache-dependency-path: |
            sbt-plugin/build.sbt
            sbt-plugin/project/build.properties

      # Runs checkClassFileVersions too, in the same sbt as the first scripted group.
      - name: Scripted tests with coverage
        run: make sbt-coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sbt-plugin/target/jacoco/jacoco.xml
          flags: sbt
          disable_search: true
          fail_ci_if_error: true

  mill:
    name: Mill plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      # Mill has no setup-java cache id, so it keeps a hand-rolled entry with the save
      # step at the end of the job. Mill resolves through coursier, hence that directory.
      - name: Restore Mill cache
        id: cache-mill
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mill
            ~/.cache/coursier
          key: mill-coursier-${{ runner.os }}-${{ hashFiles('mill-plugin/build.mill', 'mill-plugin/mill') }}
          restore-keys: |
            mill-coursier-${{ runner.os }}-

      - name: Test with coverage
        run: make mill-coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: mill-plugin/out/jacoco/jacoco.xml
          flags: mill
          disable_search: true
          fail_ci_if_error: true

      - name: Save Mill cache
        if: github.ref == 'refs/heads/main' && steps.cache-mill.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mill
            ~/.cache/coursier
          key: ${{ steps.cache-mill.outputs.cache-primary-key }}

  clojure:
    name: Clojure tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      - name: Cache Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: gradle
          cache-read-only: true
          cache-dependency-path: cli-java/*.gradle.kts

      # ~/.gitlibs holds the Clojure CLI's git deps.
      - name: Cache Maven and gitlibs
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: maven
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-path: |
            ~/.m2/repository
            ~/.gitlibs
          cache-dependency-path: clojure-tool/deps.edn

      - name: Test
        run: make clojure-test

      - name: Test with coverage
        run: make clojure-coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: clojure-tool/target/coverage/lcov.info
          flags: clojure
          disable_search: true
          fail_ci_if_error: true

  lein:
    name: Leiningen plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      - name: Cache Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: gradle
          cache-read-only: true
          cache-dependency-path: cli-java/*.gradle.kts

      - name: Cache Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: maven
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-path: ~/.m2/repository
          cache-dependency-path: lein-plugin/project.clj

      - name: Test
        # UIKA_IT_ALT_JAVA gives the lein integration test a second JDK, so it can
        # prove jdkRelease follows the project's :java-cmd and not lein's own JVM.
        # mise pins temurin-21 for the build, so any OTHER release the runner ships
        # will do. Resolved rather than hardcoded, and fatal when none is found: an
        # unset variable would expand to /bin/java and the assertion would skip
        # itself, which is how a regression test quietly stops testing.
        run: |
          set -euo pipefail
          alt=""
          for home in "${JAVA_HOME_17_X64:-}" "${JAVA_HOME_11_X64:-}" "${JAVA_HOME_25_X64:-}"; do
            if [ -n "$home" ] && [ -x "$home/bin/java" ]; then alt="$home/bin/java"; break; fi
          done
          test -n "$alt" || { echo "no alternate JDK on this runner; JAVA_HOME_* are: $(env | grep -c '^JAVA_HOME_')" >&2; exit 1; }
          echo "alternate JVM for the lein probe: $alt"
          make lein-test UIKA_IT_ALT_JAVA="$alt"

      # No java-cli-build dependency, unlike clojure-coverage: the unit suite stubs the CLI
      # with a shell script, and the real-CLI round trip stays in it/run.sh.
      - name: Test with coverage
        run: make lein-coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lein-plugin/target/coverage/lcov.info
          flags: lein
          disable_search: true
          fail_ci_if_error: true

  bazel:
    name: Bazel rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      - name: Cache Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: gradle
          cache-read-only: true
          cache-dependency-path: cli-java/*.gradle.kts

      # Bazel has no setup-java cache id, so it keeps a hand-rolled entry with the save
      # step at the end of the job.
      - name: Restore Bazel cache
        id: cache-bazel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The output base is deliberately not cached. The integration test
          # cleans it on purpose (bazel-rules/it/run.sh explains why), so
          # storing it would cost gigabytes the run discards.
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_runner/cache/repos/v1
          key: bazel-${{ runner.os }}-${{ hashFiles('bazel-rules/MODULE.bazel', 'bazel-rules/it/test-workspace/MODULE.bazel.template', 'bazel-rules/.bazelversion') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # The integration test runs with the agent attached and runs the unit suite itself,
      # so this is the whole of bazel-test.
      - name: Test with coverage
        run: make bazel-coverage

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # One report on purpose. The Makefile's bazel-coverage target says why an lcov
          # from `bazel coverage` must not be uploaded next to it.
          files: target/coverage/bazel-it.xml
          flags: bazel
          disable_search: true
          fail_ci_if_error: true

      - name: Save Bazel cache
        if: github.ref == 'refs/heads/main' && steps.cache-bazel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_runner/cache/repos/v1
          key: ${{ steps.cache-bazel.outputs.cache-primary-key }}

  # Split from the bazel job because it was the critical path by about 50 seconds. Its own
  # key, since the artifacts it fetches are the ones the lock files pin and the bazel job
  # never touches them.
  bazel-maven:
    name: Bazel rules with Maven artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      - name: Cache Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
          cache: gradle
          cache-read-only: true
          cache-dependency-path: cli-java/*.gradle.kts

      - name: Restore Bazel cache
        id: cache-bazel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Not the output base, for the reason the bazel job gives.
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_runner/cache/repos/v1
          key: bazel-maven-${{ runner.os }}-${{ hashFiles('bazel-rules/MODULE.bazel', 'bazel-rules/it/maven-workspace/MODULE.bazel.template', 'bazel-rules/it/maven-workspace/maven_install-*.json', 'bazel-rules/.bazelversion') }}
          restore-keys: |
            bazel-maven-${{ runner.os }}-
            bazel-${{ runner.os }}-

      - name: Test against Maven artifacts
        run: make bazel-maven-test

      - name: Save Bazel cache
        if: github.ref == 'refs/heads/main' && steps.cache-bazel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_runner/cache/repos/v1
          key: ${{ steps.cache-bazel.outputs.cache-primary-key }}

  # The repository ruleset requires one check named "Quality Gate", so the tool jobs can be
  # renamed or added without touching repository settings. This job carries that name and
  # fails when any tool job did not pass. always() is what makes that hold. Without it a
  # failed need skips this job, and a skipped job reports success to the ruleset.
  gate:
    name: Quality Gate
    if: always()
    needs: [cli, gradle, maven, sbt, mill, clojure, lein, bazel, bazel-maven]
    runs-on: ubuntu-latest
    steps:
      - name: Require every tool job to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          exit 1

  stage:
    name: Stage release artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No ~/.m2 restore on purpose. The cold local repo IS what this job tests:
      # v0.9.0's publish died in lein-stage because leiningen's javac subprocess had to
      # fetch lein's own clojure through the emptied :repositories, and every machine
      # that has built the plugin once, the lein job included, hides that. mise is
      # still restored, since the release runner restores the same tool cache.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_save: false

      # The three staging steps nothing else runs. The Gradle, sbt, Maven, Mill and Clojure
      # ones go through commands their own tests already exercise, so a release-only break
      # can hide in these three alone, which is exactly what happened at v0.9.0.
      - name: Stage the Leiningen plugin
        run: make lein-stage UIKA_VERSION=0.0.0-ci

      - name: Check what lein staged
        shell: bash
        run: |
          set -euo pipefail
          dir=lein-plugin/target/staging-deploy/net/exoego/uika/lein-uika/0.0.0-ci
          for f in lein-uika-0.0.0-ci.jar lein-uika-0.0.0-ci-sources.jar \
                   lein-uika-0.0.0-ci-javadoc.jar lein-uika-0.0.0-ci.pom; do
            test -s "$dir/$f" && test -s "$dir/$f.sha1"
          done
          # PomChecker rejects a <repositories> block and jreleaser.yml's
          # applyMavenCentralRules turns that into a failed release, which is the whole
          # reason lein-stage deploys with the key emptied.
          if grep -q "<repositories>" "$dir/lein-uika-0.0.0-ci.pom"; then
            echo "the staged pom carries <repositories>, which Maven Central rejects" >&2
            exit 1
          fi

      - name: Stage the CLI
        run: mise exec -- gradle -p cli-java publishAllPublicationsToStagingRepository -PuikaVersion=0.0.0-ci

      - name: Check what the CLI build staged
        shell: bash
        run: |
          set -euo pipefail
          dir=cli-java/build/staging-deploy/net/exoego/uika/uika-cli/0.0.0-ci
          for f in uika-cli-0.0.0-ci-jvm.jar uika-cli-0.0.0-ci.pom; do
            test -s "$dir/$f" && test -s "$dir/$f.sha1"
          done
          # "pom" packaging is what keeps Central from demanding a sources and a javadoc jar,
          # eight more files per release. A main jar or module metadata appearing here means
          # the publication changed shape. See PUBLISHING.md.
          grep -q "<packaging>pom</packaging>" "$dir/uika-cli-0.0.0-ci.pom"
          test ! -e "$dir/uika-cli-0.0.0-ci.jar"
          test ! -e "$dir/uika-cli-0.0.0-ci.module"
          test "$(mise exec -- java -jar "$dir/uika-cli-0.0.0-ci-jvm.jar" --version)" = "uika 0.0.0-ci"

      - name: Stage the Bazel module
        run: make bazel-stage UIKA_VERSION=0.0.0-ci

      - name: Check what stage.sh cut
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/bazel/uika-bazel-0.0.0-ci.tar.gz
          grep -q '"0.0.0-ci"' dist/bazel/bazel-rules/MODULE.bazel
          grep -q '"0.0.0-ci"' dist/bazel/bazel-rules/private/version.bzl
          # The integration test carries a local_path_override back into this repository,
          # so an archive that still had it would point consumers at a checkout they do
          # not have.
          test ! -e dist/bazel/bazel-rules/it
          python3 - <<'PY'
          import ast, pathlib, re

          src = pathlib.Path("dist/bazel/bazel-rules/private/checksums.bzl").read_text()
          spliced = re.search(r"^UIKA_CLI_SHA256 = (.*)$", src, re.M)
          assert spliced, "checksums.bzl lost its UIKA_CLI_SHA256 line"
          pin = ast.literal_eval(spliced.group(1))
          assert re.fullmatch("[0-9a-f]{64}", pin), "stage.sh left the CLI jar unpinned: %r" % pin
          PY

