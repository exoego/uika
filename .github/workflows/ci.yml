name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle-plugin/**/*.gradle*', 'gradle-plugin/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # sbt and Mill share ~/.cache/coursier, so it is cached once here. A second entry over
      # the same directory stores it twice against the repo's cache budget and the later
      # restore unpacks over the earlier one. The Mill entry below keeps only its own path.
      - name: Cache sbt and coursier
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/uika-sbt
            ~/.cache/coursier
          key: sbt-${{ runner.os }}-${{ hashFiles('sbt-plugin/build.sbt', 'sbt-plugin/project/build.properties', 'mill-plugin/build.mill') }}
          restore-keys: |
            sbt-${{ runner.os }}-

      - name: Cache Mill
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mill
          key: mill-${{ runner.os }}-${{ hashFiles('mill-plugin/build.mill', 'mill-plugin/mill') }}
          restore-keys: |
            mill-${{ runner.os }}-

      - name: Cache Maven
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            # The invoker ITs resolve into their OWN local repository
            # (maven-plugin/pom.xml sets localRepositoryPath to target/it-repo), so
            # ~/.m2 never covered them and every run refetched ~47 artifacts from
            # Central cold. That is what tripped a 429 once a third IT was added.
            # Safe to carry across runs: the invoker's install goal rewrites
            # uika-maven-plugin each time, and the prebuilds delete the uika-cli
            # entry so an edited stub is never shadowed.
            maven-plugin/target/it-repo
          key: maven-${{ runner.os }}-${{ hashFiles('maven-plugin/pom.xml', 'maven-plugin/src/it/**/*.xml', 'clojure-tool/deps.edn') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Cache Bazel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The bazelisk entry is the Bazel distribution itself; repos/v1 is the
          # repository cache, which is what saves refetching rules_java and a remote
          # JDK on every run. The OUTPUT base is deliberately not cached: the bazel
          # integration test cleans it on purpose (bazel-rules/it/run.sh explains why),
          # so storing it would cost gigabytes to restore something the run discards.
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel/_bazel_runner/cache/repos/v1
          key: bazel-${{ runner.os }}-${{ hashFiles('bazel-rules/MODULE.bazel', 'bazel-rules/it/test-workspace/MODULE.bazel.template', 'bazel-rules/.bazelversion') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Check
        # UIKA_IT_ALT_JAVA gives the lein integration test a second JDK, so it can
        # prove jdkRelease follows the project's :java-cmd and not lein's own JVM.
        # mise pins temurin-21 for the build, so any OTHER release the runner ships
        # will do. Resolved rather than hardcoded, and fatal when none is found: an
        # unset variable would expand to /bin/java and the assertion would skip
        # itself, which is how a regression test quietly stops testing.
        run: |
          set -euo pipefail
          alt=""
          for home in "${JAVA_HOME_17_X64:-}" "${JAVA_HOME_11_X64:-}" "${JAVA_HOME_25_X64:-}"; do
            if [ -n "$home" ] && [ -x "$home/bin/java" ]; then alt="$home/bin/java"; break; fi
          done
          test -n "$alt" || { echo "no alternate JDK on this runner; JAVA_HOME_* are: $(env | grep -c '^JAVA_HOME_')" >&2; exit 1; }
          echo "alternate JVM for the lein probe: $alt"
          make check UIKA_IT_ALT_JAVA="$alt"

      - name: Probe fixture verdicts against a real JVM
        run: make probe

      - name: Validate binary publishing build
        run: mise exec -- gradle -p binary-publishing help -PuikaVersion=0.0.0-ci
