# Categories for GitHub's automatically generated release notes, keyed on PR
# labels. Renovate PRs carry the "dependencies" label (renovate.json5); other
# PRs need a label to land in a category, otherwise they fall into "Other".
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 💥 Breaking changes
      labels:
        - breaking-change
    - title: 🚀 New features
      labels:
        - enhancement
    - title: 🐛 Bug fixes
      labels:
        - bug
    - title: ⚡ Performance
      labels:
        - performance
    - title: 📖 Documentation
      labels:
        - documentation
    - title: 📦 Dependency updates
      labels:
        - dependencies
    - title: 🛠 Other changes
      labels:
        - "*"
