[package]
name = "uika"
# Placeholder for dev builds only. Released binaries get their real version
# from the git tag: the release workflow exports UIKA_VERSION and cli.rs
# embeds it at compile time.
version = "0.0.0-dev"
edition = "2024"

[lints]
workspace = true

[features]
# Memory breakdown investigation (counting allocator + per-phase reporting).
memstats = []

[dependencies]
mimalloc = "0.1"
rayon = "1"
# Fallback reader only, so just deflate decompression via the same flate2
# zlib-rs backend as pass 1. The umbrella "deflate" feature also pulls zopfli
# (a compression-only optimizer uika never uses).
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
walkdir = "2"
rustc-hash = "2.1.3"
cesu8 = "1.1.0"
# zlib-rs backend: a pure-Rust deflate that inflates ~2x faster than the default
# miniz_oxide backend on the pass-1 scan (per-entry Huffman tree init dominates),
# with no C toolchain so the static cross-platform binaries still build.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
# Only used to deserialize --exclude-file (toml::from_str), so the writer
# side ("display") is off.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
