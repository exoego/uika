[tools]
# llvm-tools-preview backs cargo-llvm-cov.
rust = { version = "1.98.0", components = "rustfmt,clippy,llvm-tools-preview" }
gradle = "9.7.1"
# The default backends (conda, asdf plugin) lag behind sbt releases and have
# no 1.12.13 or later, so install the launcher from the GitHub release.
"github:sbt/sbt" = "1.13.0"
maven = "3.9.16"
clojure = "1.12.5.1664"
# 2.13.0 is a broken package: its lein script points at a 2.12.1-SNAPSHOT
# standalone jar that no GitHub release serves (404 on every install).
leiningen = "2.12.0"
java = "temurin-21"
# Bazelisk, not bazel: it reads bazel-rules/.bazelversion, so the ruleset pins the
# Bazel release its integration test runs on independently of this file.
bazelisk = "1.29.0"
# Not the `jreleaser` entry, whose GraalVM native binary dies in
# AbstractMavenDeployer.parsePom on every Maven Central deploy. bin/install needs
# java on PATH. Renovate's mise manager skips asdf plugin paths, so the annotation
# below carries the lookup, and extractVersion undoes the v the plugin strips.
# renovate: datasource=github-releases depName=jreleaser/jreleaser extractVersion=^v(?<version>.+)$
"asdf:joschi/asdf-jreleaser" = { version = "1.26.0", depends = ["java"] }
