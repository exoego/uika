[tools]
# llvm-tools-preview backs cargo-llvm-cov.
rust = { version = "1.98.0", components = "rustfmt,clippy,llvm-tools-preview" }
gradle = "9.7.1"
# The default backends (conda, asdf plugin) lag behind sbt releases and have
# no 1.12.13 or later, so install the launcher from the GitHub release.
"github:sbt/sbt" = "1.13.0"
maven = "3.9.16"
clojure = "1.12.5.1664"
# 2.13.0 is a broken package: its lein script points at a 2.12.1-SNAPSHOT
# standalone jar that no GitHub release serves (404 on every install).
leiningen = "2.12.0"
java = "temurin-21"
# Bazelisk, not bazel: it reads bazel-rules/.bazelversion, so the ruleset pins the
# Bazel release its integration test runs on independently of this file.
bazelisk = "1.29.0"
# Not the `jreleaser` registry entry, which resolves to aqua and serves
# jreleaser-native. That GraalVM image misses the reflection registration that the
# XPath call in AbstractMavenDeployer.parsePom needs. Every Maven Central deploy dies
# there with "exception creating new instance for pool", which is what killed the
# v0.9.0 publish. The asdf plugin installs the plain JVM distribution, which runs on
# the temurin pinned above and is what the first eight releases shipped with.
"asdf:joschi/asdf-jreleaser" = "1.26.0"
